<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Player | Modern Web Audio Experience</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Dynamic Immersive Background -->
        <div id="dynamic-bg" class="dynamic-bg"></div>

        <div class="app-container">
            <!-- --- TOP SEARCH BAR --- -->
            <header class="app-header">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Search songs or artists" />
                </div>
                <div id="player-status" class="status-indicator">
                    <span class="pulse"></span>
                    <span id="status-text">Ready</span>
                </div>
            </header>

            <main class="main-content">
                <!-- --- LEFT: NOW PLAYING STAGE --- -->
                <section class="now-playing-section">
                    <div class="artwork-wrapper">
                        <img
                            src=""
                            id="cover"
                            alt="Album Cover"
                            class="main-artwork" />
                    </div>

                    <div class="track-meta">
                        <div class="primary-meta">
                            <h1 id="music-title">Select a track</h1>
                            <h2 id="music-artist">Artist Name</h2>
                        </div>
                        <div class="secondary-meta">
                            <span id="music-album">Album</span> •
                            <span id="music-genre">Genre</span> •
                            <span id="music-year">Year</span>
                        </div>
                    </div>

                    <!-- Playback Interface -->
                    <div class="playback-interface">
                        <div class="progress-area">
                            <div class="time-stamps">
                                <span id="current-time">0:00</span>
                                <span id="duration">0:00</span>
                            </div>
                            <div
                                class="progress-bar-container"
                                id="player-progress">
                                <div class="progress-bg">
                                    <div
                                        class="progress-fill"
                                        id="progress"></div>
                                </div>
                            </div>
                        </div>

                        <div class="player-controls">
                            <button
                                id="shuffle"
                                class="btn-icon"
                                title="Shuffle">
                                <i class="fa-solid fa-shuffle"></i>
                            </button>
                            <button id="prev" class="btn-icon btn-lg">
                                <i class="fa-solid fa-backward-step"></i>
                            </button>
                            <button id="play" class="btn-play">
                                <i class="fa-solid fa-play" id="play-icon"></i>
                            </button>
                            <button id="next" class="btn-icon btn-lg">
                                <i class="fa-solid fa-forward-step"></i>
                            </button>
                            <button id="repeat" class="btn-icon" title="Repeat">
                                <i class="fa-solid fa-repeat"></i>
                            </button>
                        </div>

                        <div class="volume-stack">
                            <i class="fa-solid fa-volume-low" id="mute-btn"></i>
                            <input
                                type="range"
                                id="volume-slider"
                                min="0"
                                max="1"
                                step="0.01"
                                value="0.8" />
                        </div>
                    </div>
                </section>

                <!-- --- RIGHT: QUEUE & DISCOVERY --- -->
                <section class="queue-section">
                    <div class="section-header">
                        <h3>Playing Next</h3>
                        <span id="queue-count" class="badge">0 Songs</span>
                    </div>
                    <div id="playlist" class="custom-scrollbar">
                        <!-- Dynamic Rows Injected via JS -->
                    </div>
                </section>
            </main>
        </div>

        <audio id="audio-player"></audio>
        <script src="app.js"></script>
    </body>
</html>
