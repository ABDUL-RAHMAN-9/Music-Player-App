<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Player | Premium Experience</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Dynamic Blurred Background -->
        <div class="glass-bg-container">
            <img src="" id="bg-img" alt="" />
            <div class="overlay"></div>
        </div>

        <main class="player-wrapper">
            <section class="player-card">
                <!-- 1. Top Utility Bar -->
                <header class="utility-bar">
                    <button
                        id="shuffle"
                        title="Shuffle"
                        aria-label="Shuffle Selection">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button id="repeat" title="Repeat" aria-label="Repeat Mode">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                    <div class="volume-control">
                        <i class="fa-solid fa-volume-high" id="mute-btn"></i>
                        <input
                            type="range"
                            id="volume-slider"
                            min="0"
                            max="1"
                            step="0.01"
                            value="1" />
                    </div>
                </header>

                <!-- 2. Main Media Content -->
                <div class="media-info">
                    <div class="artwork-container">
                        <img
                            src=""
                            alt="Album Art"
                            id="cover"
                            class="main-artwork" />
                    </div>
                    <div class="text-meta">
                        <h2 id="music-title" class="title">Loading...</h2>
                        <h3 id="music-artist" class="artist">Artist Name</h3>
                    </div>
                </div>

                <!-- 3. Navigation & Progress -->
                <div class="playback-container">
                    <div class="progress-wrapper" id="player-progress">
                        <div class="progress-bar-bg">
                            <div class="progress-fill" id="progress"></div>
                            <div class="progress-knob"></div>
                        </div>
                        <div class="time-stamp">
                            <span id="current-time">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>

                    <div class="controls">
                        <button
                            id="prev"
                            class="secondary-btn"
                            aria-label="Previous Track">
                            <i class="fa-solid fa-backward-step"></i>
                        </button>
                        <button
                            id="play"
                            class="main-play-btn"
                            aria-label="Play or Pause">
                            <i class="fa-solid fa-play" id="play-icon"></i>
                        </button>
                        <button
                            id="next"
                            class="secondary-btn"
                            aria-label="Next Track">
                            <i class="fa-solid fa-forward-step"></i>
                        </button>
                    </div>
                </div>

                <!-- 4. Queue / Playlist Section -->
                <footer class="queue-section">
                    <div class="queue-header">
                        <h4>Up Next</h4>
                    </div>
                    <ul id="playlist" class="playlist-container">
                        <!-- JS will inject song items here -->
                    </ul>
                </footer>
            </section>
        </main>

        <!-- Hidden Audio element -->
        <audio id="audio-player"></audio>

        <script src="app.js"></script>
    </body>
</html>
