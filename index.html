<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Player | Spatial Audio Experience</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- Dual cross-fading dynamic backdrops -->
        <div id="bg-fade-1" class="dynamic-bg"></div>
        <div id="bg-fade-2" class="dynamic-bg"></div>
        <div class="bg-vignette"></div>

        <div class="app-viewport">
            <!-- Spatial 3D Album-Art Carousel Stage -->
            <section class="carousel-section">
                <div class="carousel-track" id="carousel-track">
                    <!-- Cards dynamically injected via JS -->
                </div>
            </section>

            <!-- Floating Control Capsule -->
            <footer class="control-capsule">
                <!-- Playback Group -->
                <div class="capsule-controls-left">
                    <button id="prev" class="capsule-btn" title="Previous Song">
                        <i class="fa-solid fa-backward-step"></i>
                    </button>
                    <button id="play" class="capsule-btn btn-play" title="Play">
                        <i class="fa-solid fa-play" id="play-icon"></i>
                    </button>
                    <button id="next" class="capsule-btn" title="Next Song">
                        <i class="fa-solid fa-forward-step"></i>
                    </button>
                </div>

                <!-- Integrated Embedded Mini Player Display -->
                <div class="mini-player-display">
                    <img
                        id="mini-cover"
                        src=""
                        alt="Thumbnail"
                        class="mini-cover" />
                    <div class="mini-meta">
                        <span id="mini-title" class="mini-title"
                            >Select a Track</span
                        >
                        <span id="mini-artist" class="mini-artist">Artist</span>
                    </div>

                    <div class="mini-time-info">
                        <span id="current-time">0:00</span>
                        <span style="opacity: 0.4">/</span>
                        <span id="duration">0:00</span>
                    </div>

                    <!-- Progress seek wrapper with safe taller touch height -->
                    <div class="mini-progress-area" id="progress-container">
                        <div class="mini-progress-track">
                            <div class="mini-progress-fill" id="progress"></div>
                        </div>
                    </div>
                </div>

                <!-- Utility Group -->
                <div class="capsule-controls-right">
                    <button id="shuffle" class="capsule-btn" title="Shuffle">
                        <i class="fa-solid fa-shuffle"></i>
                    </button>
                    <button id="repeat" class="capsule-btn" title="Repeat">
                        <i class="fa-solid fa-repeat"></i>
                    </button>
                    <button
                        id="queue-btn"
                        class="capsule-btn"
                        title="Playing Next">
                        <i class="fa-solid fa-list-ul"></i>
                    </button>

                    <!-- Expandable micro-volume slider -->
                    <div class="volume-controller">
                        <button id="mute-btn" class="capsule-btn" title="Mute">
                            <i
                                class="fa-solid fa-volume-high"
                                id="mute-icon"></i>
                        </button>
                        <div class="volume-slider-wrapper">
                            <input
                                type="range"
                                id="volume-slider"
                                min="0"
                                max="1"
                                step="0.01"
                                value="0.8" />
                        </div>
                    </div>
                </div>
            </footer>

            <!-- "Playing Next" Frosted Drawer -->
            <div id="queue-drawer" class="queue-drawer">
                <div class="drawer-header">
                    <div class="drawer-title-group">
                        <h3>Playing Next</h3>
                        <span id="queue-count" class="badge">20 Songs</span>
                    </div>
                    <button id="close-drawer" class="btn-close">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div id="playlist" class="drawer-playlist custom-scrollbar">
                    <!-- Cards dynamically loaded in via JS -->
                </div>
            </div>
        </div>

        <audio id="audio-player"></audio>
        <script src="app.js"></script>
    </body>
</html>
